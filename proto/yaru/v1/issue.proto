syntax = "proto3";

package yaru.v1;

import "yaru/v1/common.proto";

// issue の読み書き。元の入口は /p/<slug>/api/issues と、スクリプト無しの POST /issues。
// workspace は今の path の slug (src/web.tsx:564)。ヘッダにはしない。
service IssueService {
  // GET /api/issues (src/web.tsx:358)。並びは updatedAt の新しい順。
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  // GET /api/issues/:id (src/web.tsx:376)。CLI の hintBoard が呼ぶ (src/index.ts:734)。
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  // POST /api/issues (src/web.tsx:380)。画面の保存。POST /issues は同じ保存のフォーム版。
  rpc SaveIssue(SaveIssueRequest) returns (SaveIssueResponse);
}

// query は src/web.tsx:360-366。parent と limit と cursor は入れない。
message ListIssuesRequest {
  string workspace = 1;
  // 未設定なら絞らない。未知の値は InvalidArgument。
  optional IssueStatus status = 2;
  optional string assignee = 3;
  optional string label = 4;
  optional string query = 5;
  // true のときだけ overdue。今の due=overdue (src/web.tsx:365)。他の文字列は今は無視している。
  optional bool due_overdue = 6;
}

// 裸の配列を包んだ返事。now はこの一覧の stale と overdue を決めた時刻。
message ListIssuesResponse {
  repeated Issue issues = 1;
  string now = 2;
}

message GetIssueRequest {
  string workspace = 1;
  string id = 2;
}

// 無い id は NotFound。本文に Issue は載せない。
message GetIssueResponse {
  Issue issue = 1;
  string now = 2;
}

// 未設定は変えない。空と未設定は型で分ける。labels_set のような bool は付けない。
message SaveIssueRequest {
  string workspace = 1;
  // 未設定なら作成。作成には title が要る。
  optional string id = 2;
  optional string title = 3;
  // 未設定なら変えない。UNSPECIFIED をセットしたら InvalidArgument。
  optional IssueStatus status = 4;
  // 未設定なら変えない。空文字と none はクリア (src/store.ts:400-411)。
  optional string assignee = 5;
  // 未設定なら変えない。空の values はラベルを消す。
  optional StringList labels = 6;
  // 未設定なら変えない。空文字と none はクリア。
  optional string due_date = 7;
  // 未設定なら変えない。中の UNSPECIFIED は優先度を消す。
  optional IssuePriorityUpdate priority = 8;
  // 未設定なら変えない。空文字と none はクリア。
  optional string parent = 9;
  // 両方未設定なら blocks を変えない。両方セットは表現できない。
  oneof blocks_change {
    // 全置換。空の values は関係を消す。
    StringList blocks = 10;
    // add と remove。blocks とは同時に渡せない (src/store.ts:542-545)。
    BlockDelta block_delta = 11;
  }
  // 両方未設定なら本文を変えない。body と patch は同時に渡せない (src/store.ts:260-261)。
  oneof body_change {
    // 空文字も本文の指定である。未設定とは違う。
    string body = 12;
    PatchList patch = 13;
  }
}

// 保存後の issue。stale はこの now で決める。
message SaveIssueResponse {
  Issue issue = 1;
  string now = 2;
}
