syntax = "proto3";

package yaru.v1;

// 板と dashboard の SSE。GET /events (src/web.tsx:302)。
// https://html.spec.whatwg.org/multipage/server-sent-events.html
// 今の data は常に change で、クライアントは到着だけを見る (src/client/use-page-controller.ts:96、src/ui/live-page.ts:176)。
// 接続時に .yaru/questions/ を作る副作用を残すかは未決 (src/web.tsx:321-324)。
// : ping と : connected はストリームの message にしない。
service WatchService {
  rpc WatchWorkspace(WatchWorkspaceRequest) returns (stream WatchEvent);
}

message WatchWorkspaceRequest {
  // 今の SSE はワークスペースの createApp の中にある (src/web.tsx:302)。全ワークスペースを 1 本にはしない。
  string workspace = 1;
}

// 1 件が、ファイルが変わったという合図。フィールドは無い。
message WatchEvent {}
