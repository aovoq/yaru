syntax = "proto3";

package yaru.v1;

import "yaru/v1/common.proto";

// 板 1 画面。GET /api/page と、板の HTML が埋め込む PageData (src/web.tsx:371、src/page.ts:64)。
service PageService {
  // 無い id でも NotFound にしない。error を入れた板を返す。揃え方は routes.md。
  rpc GetPage(GetPageRequest) returns (GetPageResponse);
}

// query は板の URL (src/page.ts:95-110、src/page.ts:165-174)。
// comment、q、answer はサーバーが PageData に入れない (src/client/state.ts:233)。
message GetPageRequest {
  string workspace = 1;
  optional string query = 2;
  // issue の id、または new。
  optional string id = 3;
  optional IssueStatus status = 4;
  optional string assignee = 5;
  optional string label = 6;
  // 今は文字列 "1" のときだけ true (src/page.ts:100)。
  optional bool awaiting = 7;
  optional IssueSort sort = 8;
  optional IssueGroup group = 9;
  optional CompletedVisibility completed = 10;
  optional IssueView view = 11;
  optional IssueStatus new_status = 12;
  optional string new_parent = 13;
  optional string new_label = 14;
  optional string new_assignee = 15;
  // 失敗したフォームの ?error=。無い issue の error より優先する (src/web.tsx:719-720)。
  optional string error = 16;
}

// issue ごとの答え待ち (src/page.ts:56-62)。
message AwaitingSummary {
  int32 count = 1;
  int32 expired = 2;
  optional string soonest_answer_by = 3;
}

// 応答の見せ方。done と canceled の列では completed が all になる (src/page.ts:104-110)。
message IssueDisplay {
  IssueSort sort = 1;
  IssueGroup group = 2;
  CompletedVisibility completed = 3;
}

// TS の PageData では questions と awaitingQuestionCount は省略可能 (src/page.ts:73、src/page.ts:88)。
// getPageData は常に入れる。この message も常に入れる。
message GetPageResponse {
  repeated Issue issues = 1;
  repeated Issue all = 2;
  string query = 3;
  optional Issue current = 4;
  repeated Comment comments = 5;
  repeated Question questions = 6;
  repeated IssueEvent events = 7;
  // id が数字の issue だけ埋まる (src/page.ts:136-139)。
  repeated RepositoryCommit commits = 8;
  optional IssueStatus status = 9;
  optional string assignee = 10;
  optional string label = 11;
  bool awaiting = 12;
  // キーは issue id (src/page.ts:83)。
  map<string, AwaitingSummary> awaiting_by_issue = 13;
  IssueDisplay display = 14;
  IssueView view = 15;
  string base_path = 16;
  int32 awaiting_question_count = 17;
  string viewer = 18;
  // 無い issue なら "issue not found: <id>"。?error= があればそちら (src/web.tsx:718-720)。
  optional string error = 19;
  // この板の期限と stale を決めた時刻。ISO 8601。画面はブラウザの時計を使わない。
  string now = 20;
}
