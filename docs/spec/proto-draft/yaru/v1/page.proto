syntax = "proto3";

package yaru.v1;

import "yaru/v1/common.proto";

// 板の 1 画面分。GET /api/page と、板の HTML が埋め込む PageData (src/web.tsx:370、src/page.ts:63)。
service PageService {
  rpc GetPage(GetPageRequest) returns (Page);
}

// query の名前は板の URL (src/page.ts:93-109、src/page.ts:164-173)。
// comment、q、answer はサーバーが PageData に入れず、クライアントが URL から読む (src/client/state.ts:233)。
message GetPageRequest {
  string workspace = 1;
  optional string query = 2;
  // issue の id、または new。
  optional string id = 3;
  optional string status = 4;
  optional string assignee = 5;
  optional string label = 6;
  // 今は文字列 "1" のときだけ true (src/page.ts:99)。
  optional bool awaiting = 7;
  optional string sort = 8;
  optional string group = 9;
  optional string completed = 10;
  optional string view = 11;
  optional string new_status = 12;
  optional string new_parent = 13;
  optional string new_label = 14;
  optional string new_assignee = 15;
  // 失敗したフォームの ?error=。issue が無いときの error より優先する (src/web.tsx:715-716)。
  optional string error = 16;
}

// issue ごとの、答えを待っている質問のまとまり (src/page.ts:55-61)。
message AwaitingSummary {
  int32 count = 1;
  int32 expired = 2;
  optional string soonest_answer_by = 3;
}

// 応答に入る見せ方。依頼と違い、done と canceled の列では completed が all になる (src/page.ts:103-109)。
message IssueDisplay {
  string sort = 1;
  string group = 2;
  string completed = 3;
}

message Page {
  repeated Issue issues = 1;
  repeated Issue all = 2;
  string query = 3;
  optional Issue current = 4;
  repeated Comment comments = 5;
  repeated Question questions = 6;
  repeated IssueEvent events = 7;
  // id が数字の issue だけ埋まる (src/page.ts:135-138)。
  repeated RepositoryCommit commits = 8;
  optional string status = 9;
  optional string assignee = 10;
  optional string label = 11;
  bool awaiting = 12;
  // キーは issue id (src/page.ts:82)。
  map<string, AwaitingSummary> awaiting_by_issue = 13;
  IssueDisplay display = 14;
  // board か list (src/page.ts:48-51)。
  string view = 15;
  string base_path = 16;
  int32 awaiting_question_count = 17;
  string viewer = 18;
  // 無い issue のとき "issue not found: <id>"。?error= が有ればそちら (src/web.tsx:714-716)。
  // 今の HTTP はこのとき 404 だが本文は Page のまま。Connect の status は未決。
  optional string error = 19;
}
