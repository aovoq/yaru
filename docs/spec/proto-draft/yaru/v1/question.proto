syntax = "proto3";

package yaru.v1;

import "yaru/v1/common.proto";

// 質問の読みと、回答、取り消し、取り下げ。作成と acknowledge は CLI だけで、RPC にはしない。
service QuestionService {
  // GET /api/questions (src/web.tsx:221)。
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  // GET /api/questions/:id (src/web.tsx:230)。
  rpc GetQuestion(GetQuestionRequest) returns (GetQuestionResponse);
  // POST /api/questions/:id/answer (src/web.tsx:234)。
  // フォームの useDefault はここで展開しない。呼び出し側が本文を作る。
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // フォームの POST /questions/:id/undo (src/web.tsx:174)。JSON の対は無い。
  rpc UndoAnswer(UndoAnswerRequest) returns (UndoAnswerResponse);
  // POST /api/questions/:id/cancel (src/web.tsx:245)。body は見ない。
  rpc CancelQuestion(CancelQuestionRequest) returns (CancelQuestionResponse);
}

message ListQuestionsRequest {
  string workspace = 1;
  // 未設定なら絞らない。
  optional QuestionStatus status = 2;
  optional string issue = 3;
}

// 並びは compareQuestions (src/questions.ts:394)。now は expired を決めた時刻。
message ListQuestionsResponse {
  repeated Question questions = 1;
  string now = 2;
}

message GetQuestionRequest {
  string workspace = 1;
  string id = 2;
}

message GetQuestionResponse {
  Question question = 1;
  string now = 2;
}

message AnswerQuestionRequest {
  string workspace = 1;
  string id = 2;
  // 空や空白だけは InvalidArgument (src/questions.ts:220-223)。
  optional string body = 3;
  // 描いたときの状態。answered なら置き換え (src/questions.ts:203-209)。
  optional QuestionStatus expected_status = 4;
  // JSON は true のときだけ (src/web.tsx:240)。
  optional bool force = 5;
}

message AnswerQuestionResponse {
  Question question = 1;
  string now = 2;
}

message UndoAnswerRequest {
  string workspace = 1;
  string id = 2;
  // 取り消したい answeredAt。未設定なら比較しない (src/web.tsx:184、src/questions.ts:281)。
  optional string answered_at = 3;
}

message UndoAnswerResponse {
  Question question = 1;
  string now = 2;
}

message CancelQuestionRequest {
  string workspace = 1;
  string id = 2;
}

message CancelQuestionResponse {
  Question question = 1;
  string now = 2;
}
