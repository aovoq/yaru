syntax = "proto3";

package yaru.v1;

import "yaru/v1/common.proto";

// コメント。元の入口は /api/comments と、スクリプト無しの POST /comments。
service CommentService {
  // GET /api/comments (src/web.tsx:384)。issue が空なら今は 400。
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // POST /api/comments (src/web.tsx:390)。画面は {issue, body} を送る (src/client/issue/use-comment-posting.ts:38-42)。
  // POST /comments (src/web.tsx:395) は同じ保存で、失敗を 303 の query に載せる。
  rpc SaveComment(SaveCommentRequest) returns (Comment);
}

message ListCommentsRequest {
  string workspace = 1;
  // 空は不可 (src/web.tsx:386)。
  string issue = 2;
}

message ListCommentsResponse {
  // 古い順 (src/store.ts:650)。
  repeated Comment comments = 1;
}

message SaveCommentRequest {
  string workspace = 1;
  // 有れば更新。画面は送らない (src/store.ts:662)。
  optional string id = 2;
  optional string issue = 3;
  // 有れば親の issue を使い、issue は見ない (src/store.ts:677-678)。画面のフォームは送らない。
  optional string parent = 4;
  optional string body = 5;
}
